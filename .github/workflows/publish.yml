name: Publish social calendar

# Every 15 min, offset from :00 to dodge the top-of-hour Actions queue. Calendar slots sit
# on :00 and :30 (08:30, 12:30, 09:30, 11:30), so hourly would post half-hour slots 35+ min
# late. Minutes are free on a public repo; a run with nothing due takes about 15 s.
# In practice GitHub fires this cron only ~5 times a day, hours apart (Sep-Oct 2026), so it is a
# fallback: the hand-over step below is what posts each slot on time.
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log what is due, post nothing)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # hand-over: start the next run

concurrency:
  group: social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5.5 h hand-over wait + publishing
    steps:
      # Code + data only: media/ is served from the repo by URL, never needed on the runner.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            src
            data

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Publish due posts
        id: publish
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/main.ts

      # Runs even after a failed post, so every success is recorded and never re-posted.
      - name: Commit publish state
        run: |
          git add data/published.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(state): record published posts'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Wait for the next slot, then start a fresh run so it posts on time. A slot up to 12 h out
      # is reached in hops of at most 5.5 h (the job cap is 6 h); cron gaps never exceeded 9.7 h,
      # so some run always lands inside 12 h. The repo token may start workflow_dispatch runs.
      # A cron run that fires meanwhile queues behind this one and is replaced by the hand-over.
      - name: Hand over to the next slot
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(node src/next.ts)
          if [ -z "$s" ] || [ "$s" -gt 43200 ]; then echo "next slot not within 12 h, cron picks it up"; exit 0; fi
          w=$(( s < 19800 ? s : 19800 ))
          echo "next slot in $s s, handing over in $w s"
          sleep "$w"
          gh workflow run publish.yml --ref "$GITHUB_REF_NAME"

      - name: Fail the run if a post failed or was missed
        if: steps.publish.outcome == 'failure'
        run: exit 1
